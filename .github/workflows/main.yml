name: Build Aashreya Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Create deployment ZIP
        run: |
          cd dist
          zip -r ../aashreya-dist.zip .

      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aashreya-dist
          path: aashreya-dist.zip
